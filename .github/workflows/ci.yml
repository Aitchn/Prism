name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Prism-jar
          path: prism-plugin/build/libs/Prism-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Example-mod-jar
          path: examples/example-mod/build/libs/examples-example-mod-*.jar
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Mekanism-jar
          path: validation/mekanism/build/libs/validation-mekanism-*.jar
          if-no-files-found: error

  smoke:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [paper, folia, purpur]
        minecraft: ["26.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Prism-jar
          path: prism-plugin/build/libs
      - uses: actions/download-artifact@v4
        with:
          name: Example-mod-jar
          path: examples/example-mod/build/libs
      - uses: actions/download-artifact@v4
        with:
          name: Mekanism-jar
          path: validation/mekanism/build/libs
      - run: smoke-test/run.sh ${{ matrix.platform }} ${{ matrix.minecraft }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.platform }}-${{ matrix.minecraft }}
          path: smoke-test/work/*/server.log
          if-no-files-found: ignore
