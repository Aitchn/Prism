# Key: examplemod:ruby_counter. Shows the block platform: it faces the player when placed, counts ticks in its own
# per-block data, reacts to neighbours, offers a capability, and opens a menu that switches between its two looks (textures
# block/ruby_counter_idle.png and block/ruby_counter_active.png) when right-clicked.
base: minecraft:barrier
drop: examplemod:ruby_counter
components:
  prism:rotation: horizontal
  prism:variants: [idle, active]
  # Hums while active (custom sound from assets/examplemod/sounds.json, also put in the Bedrock pack). The active
  # texture is animated (ruby_counter_active.png.mcmeta), which becomes a flipbook on Bedrock.
  prism:ambient_sound:
    sound: examplemod:block.counter.hum
    interval: 20
    volume: 0.6
    variants: [active]
  # Glows while active: Prism puts an invisible light block next to it (above if free).
  prism:light:
    level: 12
    variants: [active]
  prism:mining:
    hardness: 1.5
    tool: pickaxe
behaviors:
  - type: examplemod:counter
    interval: 20
