# Key: examplemod:ruby  (namespace = lower-cased plugin name, value = this file's path without extension)
# Its name is item.examplemod.ruby in prism/lang/<locale>.json; each player reads it in their own language. The lore
# line below is a translation key too. Items that place a block are named by the block (block.examplemod.<block>).
base: minecraft:paper
components:
  prism:max_stack_size: 16
  prism:lore:
    - "examplemod.lore.heal"
  examplemod:tier: 2
behaviors:
  - type: examplemod:heal
    amount: 4
  - type: examplemod:use_counter
