# Prism configuration.
pack:
  # Build the resource pack from all mods and send it to players.
  enabled: true
  # Address the built-in web server listens on, and its port. Open this port in your firewall.
  bind: 0.0.0.0
  port: 8765
  # The address players use to reach this server's web server, for example play.example.com.
  # Leave empty to use server-ip from server.properties, then 127.0.0.1 (only fine for local testing).
  public-host: ""
  # Kick players who decline the pack.
  required: false
  # Message shown in the pack prompt (MiniMessage).
  prompt: "<gray>This server uses a custom content pack."
blocks:
  # How Java players are shown the looks of custom blocks whose own prism:render is auto (the default). The world
  # always stores an inert carrier block and Prism shows players the look by rewriting block packets (ADR-0022).
  #   display - the display layer (default): an invisible shell block plus a packet-only item display entity per
  #             block, drawn with the block's own model. Every look is exact and there is no limit on their number.
  #   state   - a borrowed vanilla state (note block, tripwire, ...) while one is left, then the display layer: cheaper
  #             for clients, but the pool of states is small and each block borrows the physics of its state.
  # A block can choose for itself with prism:render: state or display. Bedrock players (Geyser) see each look as a
  # registered custom block either way when bedrock.synthetic-blocks registers them; without that they see only the
  # looks drawn as borrowed states. The setting of earlier versions, backend, is still
  # read when render is absent: auto and display become display, native becomes state. Changing this needs a restart.
  # See ADR-0025.
  render: display
  display:
    # How the display layer draws a block.
    #   block - one entity at the block's centre (default), inside an invisible barrier that has the block's collision.
    #           The server stores glass there, so the entity is lit by its own cell: light passes through these blocks.
    #           No entity at all for a block hidden on all six sides.
    #   faces - one entity per visible face, lit by the cell in front of it, inside a shell from the vanilla pool
    #           (ADR-0023). Light is blocked like a normal block, at up to six entities per block.
    lighting: block
    # The most display entities one player is sent. Chunks nearest the player get theirs first and the farthest go
    # when the budget runs out; the choice follows the player as they move.
    max-per-player: 12000
    # How far from the viewer (in chunks, Chebyshev distance) display entities are sent. 0 means every chunk the
    # client has, bounded by the server's view distance. Lower it on servers with many display-drawn blocks.
    view-distance: 8
    # The entities' view range multiplier (1.0 = the client default, which scales with its entity distance setting).
    view-range: 1.0
    # Faces lighting only: also use the opaque shell of the note block family for opaque display blocks. Exact, but
    # only invisible if the client's solid render layer ignores transparent texels, which no known client does; leave
    # off unless tested.
    solid-shells: false
effects:
  # World effects (ADR-0027): block particle emitters (prism:particles), and the travelling visuals, bursts and beams
  # mods start with Prism.effects(). Nothing is a server entity; particles and packet-only displays go only to the
  # players in range who have the chunk. Changing these needs a restart.
  # How far from a travelling visual, burst or beam a player still gets it, in blocks.
  view-range: 48
  particles:
    # Ticks between two runs of the shared emitter clock. Every emitting block near a player is handled in each run;
    # the clock does not run at all while no loaded chunk has an emitting block.
    interval: 5
    # Range of an emitter that does not set its own, in blocks (at most 128).
    range: 32
    # The most particles one player is sent per second by block emitters. Blocks nearest the player go first; the
    # farthest are skipped when the budget runs out.
    max-per-player: 2000
  travel:
    # The most travelling visuals one player is shown at once; the farthest are dropped first.
    max-per-player: 64
bedrock:
  # How Geyser players are shown custom blocks (ADR-0024).
  #   auto  - when Geyser runs in this server, Prism registers one real Bedrock custom block per look through the
  #           Geyser API, with its geometry, texture, collision and hardness. There is no limit on the number of
  #           looks. Without Geyser here nothing changes. If registration fails, Prism logs a warning and keeps
  #           the older note block and tripwire mappings.
  #   proxy - Geyser runs on a proxy. Prism fixes the ids at server load and writes
  #           plugins/Prism/geyser/prism_synthetic_blocks.json for a Prism Geyser extension that registers them on
  #           the proxy. Use this only with that extension; see docs/en/bedrock.md.
  #   off   - the older route only: Geyser's JSON mappings for the note block and tripwire looks.
  # Changing this needs a restart.
  synthetic-blocks: auto
  # First synthetic block state id. 0 picks it from the server (its block state count plus 4096). Set it only when
  # Geyser runs on a proxy whose Geyser build has more block states than this server.
  synthetic-base: 0
