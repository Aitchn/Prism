# Prism configuration.
pack:
  # Build the resource pack from all mods and send it to players.
  enabled: true
  # Address the built-in web server listens on, and its port. Open this port in your firewall.
  bind: 0.0.0.0
  port: 8765
  # The address players use to reach this server's web server, for example play.example.com.
  # Leave empty to use server-ip from server.properties, then 127.0.0.1 (only fine for local testing).
  public-host: ""
  # Kick players who decline the pack.
  required: false
  # Message shown in the pack prompt (MiniMessage).
  prompt: "<gray>This server uses a custom content pack."
blocks:
  # How custom blocks are drawn.
  #   auto    - as vanilla note block states (Java and Bedrock see them; Bedrock through Geyser's custom
  #             block mappings, which Prism installs into Geyser's folder). The world stores an inert
  #             carrier block (brown mushroom block; structure void for passable blocks) and Prism shows players the
  #             note block or tripwire look by rewriting block packets. Blocks with an animated
  #             model (model_ref) still use display entities.
  #   native  - same as auto.
  #   display - always as an item display entity on a barrier (Java only; Geyser cannot draw these).
  # Changing this needs a restart.
  backend: auto
  # Looks beyond the borrowed vanilla states (Java: note block, tripwire, target, dispenser, dropper, leaves, sugar
  # cane) are drawn by the display layer: the server keeps an invisible shell block and each viewer is sent packet-only
  # item display entities per visible face. See ADR-0023.
  display:
    # How far from the viewer (in chunks, Chebyshev distance) display entities are sent. 0 means every chunk the
    # client has, bounded by the server's view distance. Lower it on servers with many display-drawn blocks.
    view-distance: 8
    # The entities' view range multiplier (1.0 = the client default, which scales with its entity distance setting).
    view-range: 1.0
    # Also use the opaque shell of the note block family for opaque display blocks. Exact, but only invisible if the
    # client's solid render layer ignores transparent texels, which no known client does; leave off unless tested.
    solid-shells: false
