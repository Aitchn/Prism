# Prism configuration.
pack:
  # Build the resource pack from all mods and send it to players.
  enabled: true
  # Address the built-in web server listens on, and its port. Open this port in your firewall.
  bind: 0.0.0.0
  port: 8765
  # The address players use to reach this server's web server, for example play.example.com.
  # Leave empty to use server-ip from server.properties, then 127.0.0.1 (only fine for local testing).
  public-host: ""
  # Kick players who decline the pack.
  required: false
  # Message shown in the pack prompt (MiniMessage).
  prompt: "<gray>This server uses a custom content pack."

blocks:
  # How custom blocks are drawn.
  #   display: a carrier block plus a display entity (default; supports BetterModel models).
  #   native:  a note block state drawn by the resource pack (no entities; 799 blocks max; EXPERIMENTAL, not verified
  #            on a real client; player-placed note blocks with an allocated state are read as that custom block).
  backend: display
