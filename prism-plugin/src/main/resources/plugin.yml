name: Prism
version: '${version}'
main: com.aitchn.prism.plugin.PrismPlugin
api-version: '1.21.4'
description: Server-side content platform. Players only need a resource pack.
author: Aitchn
website: https://github.com/Aitchn/Prism
folia-supported: true
load: POSTWORLD
depend:
  - packetevents
  - BetterModel
softdepend:
  - Geyser-Spigot
  - floodgate
  - PlaceholderAPI
commands:
  prism:
    description: Prism tools (give custom items, browse items).
    usage: /prism give <player> <item> [amount] | /prism items
permissions:
  prism.command.give:
    description: Use /prism give and /prism items.
    default: op
