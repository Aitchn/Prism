# Botania rebuild inventory: what the real mod has and how much of it the Prism rebuild covers.
# Status per entry: done | partial (counts half) | missing. InventoryTest computes the percentage, checks that every
# "done" or "partial" content entry exists in src/main/resources, and fails the build below the target of the current stage.
# Score = 50% content (items, blocks, flowers, tools, armor) + 50% mechanics. A mechanic only counts as done with a
# chain test (see src/test .../ChainTest). A colour family (16 dyes) is ONE entry: an id ending in "_@" stands for
# <id with @ replaced by each dye>, and all 16 files must exist. Runes, rods, lenses, rings and flowers count one each.
# Nothing is excluded to make the number look better: Corporea, red string, cosmetics and bosses are listed as missing.
#
