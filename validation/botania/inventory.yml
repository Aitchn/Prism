  wand_binding: done                  # wand selects a flower, binds it to a pool or spreader (0)
  petal_apothecary: done              # water, petals, seeds, flower item (0)
  mana_infusion: partial              # pool + item; no alchemy or conjuration catalysts (0)
  pure_daisy_conversion: partial      # stone and oak log only (0)
  generating_flowers: partial         # daybloom and endoflame only (0)
  mana_tablet: partial                # charge at a pool; no mana-item charging in the pool, no tool repair (0)
