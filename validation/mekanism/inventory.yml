mechanics:  # systems that must work together; each needs a chain test in src/test (stage that proves it in brackets)
  machine_gui: partial            # one slot in/out, no side tabs, no upgrade slots (1)
  machine_persistence: done       # state in per-block data, chunk unload and restart
  energy_network: done            # cables share energy between generators and machines
  chemical_network: partial       # one pipe tier, water/hydrogen/oxygen only (2)
  dust_chain_single_step: done    # ore -> dust/clump in one machine
  dust_chain_3x: missing          # ore -> dirty dust -> dust via injection, all metals (1)
  dust_chain_5x: missing          # ore -> slurry -> crystal -> shard -> clump -> dirty dust -> dust (2)
  infusion_system: missing        # infuse types, infuser stores them, metallurgic recipes (1)
  smelting_machines: missing      # energized smelter fed by dust and ingot recipes (1)
  alloys: missing                 # steel, bronze, refined obsidian/glowstone made by machines (1)
  upgrades: missing               # speed and energy upgrades in upgrade slots (1)
  tiers: missing                  # 4 tiers of cables, pipes, cubes, factories (3)
  side_configuration: missing     # per-side input/output/off, configurator tool (3)
  auto_eject: missing             # machines push outputs to neighbours (3)
  item_transport: missing         # logistical transporter with colours and filters (3)
  heat: missing                   # heat transfer, thermoelectric (5)
  ore_generation: missing         # needs the Prism world-generation hook (1, blocked)
  block_drops_keep_data: missing  # machines and cubes keep contents when broken (needs Prism gap)
  redstone_control: missing       # per-machine redstone mode (3)
  security: missing               # owner and access levels (6)
  radiation: missing              # radiation sources and exposure (6)
  multiblock_dynamic_tank: missing   # needs the Prism structure service (5)
  multiblock_induction_matrix: missing  # needs the Prism structure service (5)
  digital_miner: missing          # filters, radius, quarry loop (4)
  teleporter_system: missing      # frequencies, linking, energy cost (4)
  factory_system: missing         # 3 to 4 tiers of 8 machine kinds (4)
  chemical_tanks: missing         # gas tank and fluid tank with tiers (2)
  qio_storage: missing            # QIO drive array network (6)
  worldgen_salt_and_fluorite: missing  # world generation again (1, blocked)
  portable_tools: partial         # tablet done; jetpack, disassembler, flamethrower etc. (6)
