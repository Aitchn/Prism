mechanics:  # systems that must work together; each needs a chain test in src/test (stage that proves it in brackets)
  machine_gui: partial            # two input slots, one output, upgrades by right click; no side tabs (3)
  machine_persistence: done       # state in per-block data, chunk unload and restart
  energy_network: done            # cables share energy between generators and machines
  chemical_network: done          # pipes with per-face tank choice, fair sharing, storage tanks; one pipe tier (tiers are counted under tiers)
  dust_chain_single_step: done    # ore -> dust/clump in one machine
  dust_chain_3x: done             # ore -> clump -> dirty dust -> dust -> ingot for all seven metals, FactoryChainTest
  dust_chain_5x: done             # ore -> slurry -> clean slurry -> crystal -> shard -> clump -> dirty dust -> dust -> ingot, osmium chain test
  infusion_system: partial        # infuse items sit in the second slot instead of an infusion tank (steel, bronze, alloys)
  smelting_machines: done         # energized smelter, dust to ingot for all metals and alloys
  alloys: done                    # steel, bronze, infused/reinforced/atomic alloy, refined obsidian and glowstone
  upgrades: partial               # speed and energy upgrades only; muffling, filter, gas, anchor missing
  tiers: done                     # cubes, cables, pipes, transporters and factories have four tiers
  side_configuration: partial     # chemical and item faces done (configurator; item configurator for items); energy faces still open
  auto_eject: done                # hopper toggles it; output goes out through transporters
  item_transport: partial         # transporters with colours, tiers and chained machines; filters and sorters missing (4)
  heat: missing                   # heat transfer, thermoelectric (5)
  ore_generation: missing         # needs the Prism world-generation hook (1, blocked)
  block_drops_keep_data: done     # machines and cubes keep energy, upgrades, tanks and face settings in the dropped item
  redstone_control: done          # redstone dust cycles ignore / with signal / without signal
  security: missing               # owner and access levels (6)
  radiation: missing              # radiation sources and exposure (6)
  multiblock_dynamic_tank: partial   # plugin-side validation (3..18 cube, valves, chemicals only); no GUI, no fluids
  multiblock_induction_matrix: missing  # needs the Prism structure service (5)
  digital_miner: partial          # scans a radius, mines ores into the output; no custom filters, no silk touch, spills extra stacks
  teleporter_system: partial      # name-tag frequencies, energy by distance, click to travel; no portal frame, no GUI
  factory_system: done            # nine kinds in four tiers, 3 to 9 lanes; chained with transporters in FactoryTest
  chemical_tanks: partial         # chemical and fluid tank, one tier each
  qio_storage: missing            # QIO drive array network (6)
  worldgen_salt_and_fluorite: missing  # world generation again (1, blocked)
  portable_tools: partial         # tablet done; jetpack, disassembler, flamethrower etc. (6)
