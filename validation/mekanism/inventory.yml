# Mekanism rebuild inventory: what the real base module has and how much of it the Prism rebuild covers.
# Status per entry: done | partial (counts half) | missing. InventoryTest computes the percentage, checks that every
# "done" content entry exists in src/main/resources, and fails the build below the target of the current stage.
# Score = 50% content (items, blocks, machines, factories) + 50% mechanics. Scope: base module only
# (Generators, Tools and Additions are excluded). A mechanic only counts as done with a chain test.
#
