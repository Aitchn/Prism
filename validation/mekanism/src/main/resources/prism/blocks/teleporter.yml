# Key: mekanism:teleporter. Right click: travel to the next teleporter with the same frequency (a name tag with a name tunes it); the clicked teleporter pays energy by distance.
base: minecraft:barrier
drop: mekanism:teleporter
components:
  prism:variants: [idle, active]
behaviors:
  - type: mekanism:machine
    machine: teleporter
    teleporter: true
    energy_capacity: 200000
    max_receive: 20000
    tank_capacity: 0
